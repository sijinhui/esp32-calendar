; ESP32-S3 + 4.2 寸三色墨水屏日历
;
;   pio run -e esp32s3 -t upload        编译并烧录
;   pio device monitor                   串口日志
;   pio test -e native                   在电脑上跑单元测试（农历/节气/节假日/iCal 解析）

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 模组为 N16R8：16MB Flash + 8MB 片内 Octal PSRAM
; 分区：两个 6.25MB 固件分区（为以后 OTA 升级预留）+ 3.4MB LittleFS
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Serial 走原生 USB 口；日志同时会镜像到 UART0（见 src/Log.h），插哪个 USB 口都能看到
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    h2zero/NimBLE-Arduino@^1.4.3
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.4.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
