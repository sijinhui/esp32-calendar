; ESP32-S3 + 4.2 寸三色墨水屏日历
;
;   pio run -e esp32s3 -t upload        编译并烧录
;   pio device monitor                   串口日志
;   pio test -e native                   在电脑上跑单元测试（农历/节气/节假日/iCal 解析）

[platformio]
default_envs = esp32s3

[env:esp32s3]
; 锁定平台版本：不锁的话 CI 缓存过期后会装最新版（8.x 换成了 Arduino 3.x），编出来的固件跟本地测过的不一样
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
; 模组为 N16R8：16MB Flash + 8MB 片内 Octal PSRAM
; 分区：两个 6.25MB 固件分区（为以后 OTA 升级预留）+ 3.4MB LittleFS
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; 自己编译的固件版本号用 git describe 生成（scripts/version.py）
extra_scripts = pre:scripts/version.py
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Serial 走原生 USB 口；日志同时会镜像到 UART0（见 src/Log.h），插哪个 USB 口都能看到
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    h2zero/NimBLE-Arduino@^1.4.3
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.4.2

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

; Seeed XIAO ESP32-C5（8MB Flash + 8MB PSRAM，外接天线）：平台 7.1.3（Arduino 2.x）不支持 C5，要用 pioarduino 社区平台（Arduino 3.x）
;   pio run -e esp32c5 -t upload
; 引脚见 include/config.h 里 CONFIG_IDF_TARGET_ESP32C5 那几段
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
; 板子在跑固件时自动复位进下载模式后，esptool 的 stub 在 C5 上经常起不来（Failed to start stub flasher），不用 stub 稳定
upload_flags = --no-stub
extra_scripts = pre:scripts/version.py
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; C5 没有 USB OTG，只有 USB-Serial/JTAG，要指定 USB_MODE=1，否则会去找 TinyUSB 的 USBSerial
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2@^1.6.4
    h2zero/NimBLE-Arduino@^2.5.1
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson@^7.4.2
