name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 在 GitHub 上新建并发布 Release 时编译固件、上传到这个 Release；设备的在线升级从这里下载 firmware.bin
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: 单元测试（农历 / 节假日 / iCal / 订阅文本）
        run: pio test -e native
      - name: 网页订阅脚本回归测试
        run: node tools/test_web_subscriptions.mjs

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32s3-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: 编译固件
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # 版本号编译进固件：Release 用 tag 名（设备拿它跟最新 Release 比较），其余是 dev-<commit>（不自动升级）
          if [ "${{ github.event_name }}" = release ]; then
            VERSION="$TAG"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"$VERSION\\\"" pio run -e esp32s3
          grep -qa "$VERSION" .pio/build/esp32s3/firmware.bin || { echo "固件里找不到版本号 $VERSION"; exit 1; }
      - name: 检查 OTA 用的根证书还能连上 GitHub 和镜像
        run: |
          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' src/OtaRootCAs.h > roots.pem
          check() { echo | openssl s_client -connect $1:443 -servername $1 -CAfile roots.pem -verify_return_error > /dev/null 2>&1; }
          # 固件下载会从 github.com 跳转到这两个文件服务器
          for host in github.com release-assets.githubusercontent.com objects.githubusercontent.com; do
            check $host && echo "OK  $host" || { echo "根证书校验失败：$host（GitHub 可能换了证书机构，需要更新 src/OtaRootCAs.h）"; exit 1; }
          done
          # 镜像是第三方服务，偶尔连不上不算失败，只提醒
          for prefix in $(grep '^#define OTA_MIRRORS' include/config.h | grep -o '"https://[^"]*' | tr -d '"'); do
            host=$(echo $prefix | cut -d/ -f3)
            if ! check $host; then
              issuer=$(echo | openssl s_client -connect $host:443 -servername $host -showcerts 2>/dev/null | grep -m1 'i:' || true)
              echo "::warning::镜像 $host 证书校验失败（$issuer），设备会跳过它；如果是换了证书机构，把根证书加到 src/OtaRootCAs.h"
              continue
            fi
            # 按设备的方式通过镜像下载最新 Release 的固件，看能不能下载
            code=$(curl -sS -L --max-time 120 -o mirror.bin -w '%{http_code}' \
              "${prefix}https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/firmware.bin" || true)
            echo "OK  $host 证书；下载最新固件 HTTP $code，$(stat -c %s mirror.bin 2>/dev/null || echo 0) 字节"
            [ "$code" = 200 ] || echo "::warning::镜像 $prefix 下载失败（HTTP $code）：$(head -c 300 mirror.bin | tr -d '\n')"
          done
      - name: 打包
        run: |
          B=.pio/build/esp32s3
          mkdir -p dist
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin $B/firmware.elf dist/
          # 合并成一个从 0x0 开始烧录的完整镜像，不装 PlatformIO 也能用 esptool / 网页烧录工具烧
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o dist/firmware-merged.bin --flash_mode keep --flash_freq keep --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          # 设备检查更新时读这个文件（版本号、大小、MD5），不用调 api.github.com，镜像也能代理
          printf '{"version":"%s","size":%d,"md5":"%s"}\n' "$VERSION" $(stat -c %s $B/firmware.bin) \
            $(md5sum $B/firmware.bin | cut -d' ' -f1) > dist/latest.json
          cat dist/latest.json
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: dist/

  release:
    if: github.event_name == 'release'
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: dist
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
